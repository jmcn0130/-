<div class="container">
  <h1>🐺DUSCAT狼人殺</h1>

  <!-- 1. 大廳區塊 -->
  <div id="lobby-section" class="card">
    <h2>加入或建立遊戲</h2>
    <div
      style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;"
    >
      <input
        type="text"
        id="nickname"
        placeholder="輸入你的暱稱"
        maxlength="10"
      />
      <button class="btn btn-success" onclick="initMic()">
        🎤 測試/啟用麥克風
      </button>
      <span
        id="mic-status"
        style="align-self: center; font-size: 0.9rem; color: #888;"
        >麥克風未開啟</span
      >
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <button class="btn" onclick="createRoom()">創建新房間 (房主)</button>
      <input type="text" id="join-room-id" placeholder="輸入房間號碼" />
      <button class="btn" onclick="joinRoom()">加入房間</button>
    </div>
  </div>

  <!-- 2. 房間資訊與遊戲區塊 -->
  <div id="room-section" class="card hidden">
    <div
      style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;"
    >
      <div>
        <h2>
          房間號碼：<span
            id="display-room-id"
            style="color: var(--accent);"
          ></span>
        </h2>
        <p
          id="role-display"
          style="font-size: 1.2rem; font-weight: bold; margin: 5px 0;"
        ></p>
      </div>
      <div>
        <button
          id="mic-toggle-btn"
          class="btn btn-warning"
          onclick="toggleMicMute()"
        >
          🎤 麥克風：靜音
        </button>
        <button
          id="start-game-btn"
          class="btn hidden"
          onclick="hostStartGame()"
        >
          開始遊戲 (需至少 5 人)
        </button>
      </div>
    </div>

    <h3>
      當前階段：<span id="phase-display" style="color: #38bdf8;"
        >等待玩家加入...</span
      >
    </h3>

    <!-- 玩家列表 -->
    <div id="player-list" class="grid"></div>

    <!-- 操作面板區 -->
    <div
      id="action-section"
      class="card"
      style="background: #14141d; margin-top: 15px;"
    >
      <h3>🎮 行動面板</h3>
      <div id="action-content" class="action-panel">無可用操作</div>
    </div>
  </div>

  <!-- 3. 遊戲日誌區塊 -->
  <div id="log-section" class="card hidden">
    <h3>📜 遊戲紀錄與公告</h3>
    <div id="game-log" class="log-box"></div>
  </div>
</div>

<!-- 語音通話用的隱藏 Audio 元素容器 -->
<div id="audio-container" style="display:none;"></div>
