<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC 狼人殺多人連線</title>
  <!-- 引入 PeerJS WebRTC 套件 -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container { width: 100%; max-width: 500px; }
    h1 { text-align: center; margin-bottom: 20px; color: #ff5252; }

    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #2d2d2d;
      border: 1px solid #444;
      color: white;
      border-radius: 6px;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 6px;
      background: #424242;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .btn.primary { background: #e53935; }
    .btn.primary:hover { background: #d32f2f; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .hidden { display: none !important; }
    hr { border: 0; height: 1px; background: #333; margin: 15px 0; }

    ul { list-style: none; padding: 0; margin: 15px 0; }
    li {
      padding: 10px;
      background: #2a2a2a;
      margin-bottom: 6px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }

    .tag { font-size: 12px; padding: 2px 6px; background: #ff9800; border-radius: 4px; color: black; }
    .badge { padding: 6px 12px; background: #333; border-radius: 20px; font-size: 14px; font-weight: bold; }
    .badge.role { background: #673ab7; }

    .log-box {
      background: #121212;
      border: 1px solid #333;
      height: 180px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      margin: 15px 0;
    }
    .log-item { margin-bottom: 6px; border-bottom: 1px solid #222; padding-bottom: 4px; }
    .action-box { background: #2a2a2a; padding: 15px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐺 狼人殺 Werewolf</h1>

    <!-- 步驟 1: 登入/建立房間 -->
    <div id="login-card" class="card">
      <h2>玩家設定</h2>
      <input type="text" id="username" placeholder="輸入你的暱稱" value="玩家A">
      <hr>
      <button id="btn-create-room" class="btn primary">創建新房間 (擔任房主)</button>
      <div style="margin: 15px 0; text-align: center;">或</div>
      <input type="text" id="room-id-input" placeholder="輸入房間代碼">
      <button id="btn-join-room" class="btn">加入房間</button>
    </div>

    <!-- 步驟 2: 遊戲等待大廳 -->
    <div id="lobby-card" class="card hidden">
      <h2>遊戲大廳 <span id="room-tag" class="tag"></span></h2>
      <p>房間代碼：<b id="room-code-display"></b> (複製分享給好友)</p>
      
      <h3>玩家列表 (<span id="player-count">0</span>)</h3>
      <ul id="player-list"></ul>

      <div id="host-controls" class="hidden">
        <button id="btn-start-game" class="btn primary">房主開始遊戲</button>
      </div>
      <p id="client-waiting-msg" class="info-text">等待房主開始遊戲...</p>
    </div>

    <!-- 步驟 3: 遊戲主畫面 -->
    <div id="game-card" class="card hidden">
      <div class="game-header">
        <span id="phase-display" class="badge">階段：準備中</span>
        <span id="role-display" class="badge role">你的身份：未知</span>
      </div>

      <div id="game-log" class="log-box"></div>

      <div id="action-panel" class="action-box">
        <h3>可執行動作</h3>
        <div id="action-buttons"></div>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    let connections = {}; // 房主記錄所有客戶端連線
    let hostConn = null;  // 組員記錄與房主的連線
    let myId = '';
    let myName = '';
    let isHost = false;

    // 遊戲狀態 (由房主維護)
    let players = []; // { id, name, role, isAlive: true }
    let gamePhase = 'LOBBY'; // LOBBY, NIGHT_WOLF, DAY_VOTE, END
    let votes = {};

    // UI 元素
    const loginCard = document.getElementById('login-card');
    const lobbyCard = document.getElementById('lobby-card');
    const gameCard = document.getElementById('game-card');
    const usernameInput = document.getElementById('username');
    const playerList = document.getElementById('player-list');
    const logBox = document.getElementById('game-log');
    const actionButtons = document.getElementById('action-buttons');

    // 初始化 Peer
    function initPeer(customId = null) {
      return new Promise((resolve) => {
        peer = customId ? new Peer(customId) : new Peer();
        peer.on('open', (id) => {
          myId = id;
          resolve(id);
        });
      });
    }

    // 建立房間 (房主)
    document.getElementById('btn-create-room').addEventListener('click', async () => {
      myName = usernameInput.value.trim() || '房主';
      isHost = true;
      
      // 生成短房間號
      const roomId = 'room-' + Math.random().toString(36).substring(2, 7);
      await initPeer(roomId);

      document.getElementById('room-code-display').innerText = roomId;
      document.getElementById('room-tag').innerText = '房主';
      document.getElementById('host-controls').classList.remove('hidden');
      document.getElementById('client-waiting-msg').classList.add('hidden');

      players.push({ id: myId, name: myName, isAlive: true, role: '' });
      updateLobbyUI();

      // 監聽組員連線
      peer.on('connection', (conn) => {
        conn.on('open', () => {
          connections[conn.peer] = conn;
        });

        conn.on('data', (data) => {
          handleHostMessage(conn.peer, data);
        });

        conn.on('close', () => {
          delete connections[conn.peer];
          players = players.filter(p => p.id !== conn.peer);
          broadcastState();
        });
      });

      showCard(lobbyCard);
    });

    // 加入房間 (組員)
    document.getElementById('btn-join-room').addEventListener('click', async () => {
      myName = usernameInput.value.trim() || '玩家';
      const targetRoomId = document.getElementById('room-id-input').value.trim();
      if (!targetRoomId) return alert('請輸入房間代碼');

      isHost = false;
      await initPeer();

      hostConn = peer.connect(targetRoomId);

      hostConn.on('open', () => {
        hostConn.send({ type: 'JOIN', name: myName });
        document.getElementById('room-code-display').innerText = targetRoomId;
        document.getElementById('room-tag').innerText = '組員';
        showCard(lobbyCard);
      });

      hostConn.on('data', (data) => {
        handleClientMessage(data);
      });

      hostConn.on('close', () => {
        alert('與房主的連線已中斷！');
        location.reload();
      });
    });

    // 房主接收訊息
    function handleHostMessage(peerId, data) {
      if (data.type === 'JOIN') {
        players.push({ id: peerId, name: data.name, isAlive: true, role: '' });
        broadcastState();
      } else if (data.type === 'ACTION_SUBMIT') {
        votes[peerId] = data.targetId;
        checkPhaseCompletion();
      }
    }

    // 組員接收訊息
    function handleClientMessage(data) {
      if (data.type === 'SYNC_STATE') {
        players = data.players;
        gamePhase = data.gamePhase;
        updateLobbyUI();
        
        if (gamePhase !== 'LOBBY') {
          showCard(gameCard);
          renderGameUI(data.personalRole);
        }
      } else if (data.type === 'LOG') {
        appendLog(data.msg);
      }
    }

    // 廣播最新狀態給所有人
    function broadcastState() {
      updateLobbyUI();
      players.forEach(p => {
        if (p.id === myId) return; // 房主自己不用傳
        if (connections[p.id]) {
          connections[p.id].send({
            type: 'SYNC_STATE',
            players: players.map(pInfo => ({ id: pInfo.id, name: pInfo.name, isAlive: pInfo.isAlive })),
            gamePhase: gamePhase,
            personalRole: p.role // 只發送屬於該玩家的私密身份
          });
        }
      });

      if (gamePhase !== 'LOBBY') {
        const hostRole = players.find(p => p.id === myId)?.role;
        renderGameUI(hostRole);
      }
    }

    // 更新大廳介面
    function updateLobbyUI() {
      document.getElementById('player-count').innerText = players.length;
      playerList.innerHTML = players.map(p => 
        `<li>${p.name} ${p.id === myId ? '(你)' : ''} ${p.id === players[0].id ? '<span class="tag">房主</span>' : ''}</li>`
      ).join('');
    }

    // 房主：開始遊戲與分配身份
    document.getElementById('btn-start-game').addEventListener('click', () => {
      if (players.length < 3) return alert('遊戲人數至少需要 3 人！');

      // 簡單配牌：1狼人，1預言家，其餘平民 (可根據人數擴充)
      let roles = ['狼人', '預言家'];
      while (roles.length < players.length) {
        roles.push('平民');
      }
      roles.sort(() => Math.random() - 0.5); // 洗牌

      players.forEach((p, index) => {
        p.role = roles[index];
        p.isAlive = true;
      });

      gamePhase = 'NIGHT_WOLF';
      broadcastState();
      broadcastLog('🌙 夜幕降臨，狼人請睜眼殺人...');
    });

    // 渲染遊戲操作 UI
    function renderGameUI(myRole) {
      document.getElementById('role-display').innerText = `你的身份：${myRole}`;
      document.getElementById('phase-display').innerText = `階段：${getPhaseName(gamePhase)}`;
      
      actionButtons.innerHTML = '';
      const me = players.find(p => p.id === myId);

      if (!me.isAlive) {
        actionButtons.innerHTML = '<p>你已經死亡，無法行動。</p>';
        return;
      }

      // 根據階段與身份顯示行動按鈕
      if (gamePhase === 'NIGHT_WOLF' && myRole === '狼人') {
        players.filter(p => p.isAlive).forEach(p => {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = `襲擊 ${p.name}`;
          btn.onclick = () => submitAction(p.id);
          actionButtons.appendChild(btn);
        });
      } else if (gamePhase === 'DAY_VOTE') {
        players.filter(p => p.isAlive && p.id !== myId).forEach(p => {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = `放逐 ${p.name}`;
          btn.onclick = () => submitAction(p.id);
          actionButtons.appendChild(btn);
        });
      } else {
        actionButtons.innerHTML = '<p>請等待其他玩家行動...</p>';
      }
    }

    // 玩家提交操作
    function submitAction(targetId) {
      actionButtons.innerHTML = '<p>行動已鎖定，等待其他人...</p>';
      if (isHost) {
        votes[myId] = targetId;
        checkPhaseCompletion();
      } else {
        hostConn.send({ type: 'ACTION_SUBMIT', targetId: targetId });
      }
    }

    // 房主：檢查階段完成並推進流程
    function checkPhaseCompletion() {
      if (!isHost) return;

      if (gamePhase === 'NIGHT_WOLF') {
        const wolves = players.filter(p => p.isAlive && p.role === '狼人');
        if (Object.keys(votes).length >= wolves.length) {
          // 計算死者
          const targetId = Object.values(votes)[0]; // 簡化邏輯：取第一個狼人的選擇
          const victim = players.find(p => p.id === targetId);
          if (victim) victim.isAlive = false;

          votes = {};
          gamePhase = 'DAY_VOTE';
          broadcastState();
          broadcastLog(`☀️ 太陽升起，玩家 [${victim ? victim.name : '無'}] 昨晚遇害了！請開始討論並投票放逐。`);
          checkWinCondition();
        }
      } else if (gamePhase === 'DAY_VOTE') {
        const alivePlayers = players.filter(p => p.isAlive);
        if (Object.keys(votes).length >= alivePlayers.length) {
          // 統計票數
          const voteCounts = {};
          Object.values(votes).forEach(id => voteCounts[id] = (voteCounts[id] || 0) + 1);
          
          let maxVotes = 0;
          let executedId = null;
          for (let id in voteCounts) {
            if (voteCounts[id] > maxVotes) {
              maxVotes = voteCounts[id];
              executedId = id;
            }
          }

          const executed = players.find(p => p.id === executedId);
          if (executed) executed.isAlive = false;

          votes = {};
          gamePhase = 'NIGHT_WOLF';
          broadcastState();
          broadcastLog(`⚖️ 投票結果：玩家 [${executed ? executed.name : '無'}] 被投票放逐！`);
          checkWinCondition();
        }
      }
    }

    // 檢查勝負條件
    function checkWinCondition() {
      const aliveWolves = players.filter(p => p.isAlive && p.role === '狼人');
      const aliveHumans = players.filter(p => p.isAlive && p.role !== '狼人');

      if (aliveWolves.length === 0) {
        broadcastLog('🎉 遊戲結束！好人陣營獲得勝利！');
        gamePhase = 'END';
      } else if (aliveWolves.length >= aliveHumans.length) {
        broadcastLog('🐺 遊戲結束！狼人陣營獲得勝利！');
        gamePhase = 'END';
      }
    }

    // 廣播日誌
    function broadcastLog(msg) {
      appendLog(msg);
      if (isHost) {
        Object.values(connections).forEach(conn => conn.send({ type: 'LOG', msg: msg }));
      }
    }

    function appendLog(msg) {
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerText = msg;
      logBox.appendChild(item);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function showCard(cardToShow) {
      [loginCard, lobbyCard, gameCard].forEach(card => card.classList.add('hidden'));
      cardToShow.classList.remove('hidden');
    }

    function getPhaseName(phase) {
      switch (phase) {
        case 'NIGHT_WOLF': return '黑夜 (狼人行動)';
        case 'DAY_VOTE': return '白天 (投票放逐)';
        case 'END': return '遊戲結束';
        default: return '等待中';
      }
    }
  </script>
</body>
</html>
