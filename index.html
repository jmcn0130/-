<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁版狼人殺遊戲</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #e53935;
            --text-color: #ffffff;
            --text-sub: #b0bec5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1, h2 { color: var(--primary-color); margin-top: 0; }
        
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }

        .screen { display: none; }
        .active { display: block; }

        .player-list {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        .player-item {
            background: #2a2a2a;
            margin: 6px 0;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dead { text-decoration: line-through; color: #777; }
        .hidden-card {
            background: #333;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 設定玩家畫面 -->
    <div id="setup-screen" class="screen active">
        <h1>🐺 網頁版狼人殺</h1>
        <p style="color: var(--text-sub);">標準 6 人局配置：<br>2 狼人 | 1 預言家 | 1 女巫 | 2 平民</p>
        
        <div id="player-inputs">
            <input type="text" class="player-name" value="玩家 1">
            <input type="text" class="player-name" value="玩家 2">
            <input type="text" class="player-name" value="玩家 3">
            <input type="text" class="player-name" value="玩家 4">
            <input type="text" class="player-name" value="玩家 5">
            <input type="text" class="player-name" value="玩家 6">
        </div>
        
        <button class="btn" onclick="startGame()">開始遊戲（發放身分）</button>
    </div>

    <!-- 2. 查看身分畫面（傳閱） -->
    <div id="reveal-screen" class="screen">
        <h2>請將手機交給</h2>
        <h1 id="reveal-player-name" style="color: #4fc3f7;">-</h1>
        
        <div id="role-box" class="hidden-card">???</div>
        
        <button id="show-role-btn" class="btn" onclick="showRole()">點擊查看身分</button>
        <button id="next-reveal-btn" class="btn" style="display:none;" onclick="nextReveal()">確認並交給下一位</button>
    </div>

    <!-- 3. 夜晚階段 -->
    <div id="night-screen" class="screen">
        <h2>🌙 天黑請閉眼</h2>
        <p id="night-instruction" style="color: var(--text-sub);"></p>
        
        <div id="night-actions"></div>
        <button id="night-next-btn" class="btn" onclick="processNightStep()">下一步</button>
    </div>

    <!-- 4. 白天討論與投票 -->
    <div id="day-screen" class="screen">
        <h2>☀️ 天亮了</h2>
        <div id="night-report" style="background:#2a2a2a; padding:15px; border-radius:6px; margin-bottom:15px;"></div>
        
        <h3>存活玩家列表：</h3>
        <ul id="day-player-list" class="player-list"></ul>

        <h3>放逐投票：</h3>
        <select id="vote-select"></select>
        <button class="btn" onclick="castVote()">處決投票目標</button>
    </div>

    <!-- 5. 遊戲結束 -->
    <div id="gameover-screen" class="screen">
        <h1 id="winner-title"></h1>
        <h3>完整身分公開：</h3>
        <ul id="final-roles" class="player-list"></ul>
        <button class="btn" onclick="location.reload()">重新開始</button>
    </div>
</div>

<script>
    // 遊戲狀態 Variables
    let players = [];
    let currentRevealIndex = 0;
    let nightStep = 0; // 0: 狼人, 1: 預言家, 2: 女巫
    
    // 角色設定 (6人標準局)
    const rolesConfig = ['狼人', '狼人', '預言家', '女巫', '平民', '平民'];
    
    // 夜晚行動記錄
    let wolfTarget = null;
    let seerTarget = null;
    let witchSave = false;
    let witchPoisonTarget = null;
    let witchHasSave = true;
    let witchHasPoison = true;

    // 洗牌演算法
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startGame() {
        const inputs = document.querySelectorAll('.player-name');
        const names = Array.from(inputs).map((input, idx) => input.value.trim() || `玩家 ${idx + 1}`);
        
        const shuffledRoles = shuffle([...rolesConfig]);
        
        players = names.map((name, idx) => ({
            id: idx,
            name: name,
            role: shuffledRoles[idx],
            isAlive: true
        }));

        currentRevealIndex = 0;
        showScreen('reveal-screen');
        updateRevealUI();
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // 身分查看階段邏輯
    function updateRevealUI() {
        document.getElementById('reveal-player-name').innerText = players[currentRevealIndex].name;
        document.getElementById('role-box').innerText = '???';
        document.getElementById('show-role-btn').style.display = 'block';
        document.getElementById('next-reveal-btn').style.display = 'none';
    }

    function showRole() {
        const p = players[currentRevealIndex];
        document.getElementById('role-box').innerText = `你的身分是：${p.role}`;
        document.getElementById('show-role-btn').style.display = 'none';
        document.getElementById('next-reveal-btn').style.display = 'block';
    }

    function nextReveal() {
        currentRevealIndex++;
        if (currentRevealIndex < players.length) {
            updateRevealUI();
        } else {
            startNightPhase();
        }
    }

    // 夜晚階段邏輯
    function startNightPhase() {
        nightStep = 0;
        wolfTarget = null;
        seerTarget = null;
        witchSave = false;
        witchPoisonTarget = null;
        showScreen('night-screen');
        processNightStep();
    }

    function processNightStep() {
        const actionsDiv = document.getElementById('night-actions');
        const instruction = document.getElementById('night-instruction');
        actionsDiv.innerHTML = '';

        if (nightStep === 0) {
            // 狼人階段
            instruction.innerText = "🐺 狼人請睜眼，選擇今晚要襲擊的對象：";
            let selectHtml = `<select id="wolf-select"><option value="">-- 不殺人 --</option>`;
            players.filter(p => p.isAlive).forEach(p => {
                selectHtml += `<option value="${p.id}">${p.name}</option>`;
            });
            selectHtml += `</select>`;
            actionsDiv.innerHTML = selectHtml;

        } else if (nightStep === 1) {
            // 保存狼人選擇
            const val = document.getElementById('wolf-select').value;
            wolfTarget = val !== "" ? parseInt(val) : null;

            // 預言家階段
            instruction.innerText = "🔮 預言家請睜眼，選擇要查驗的玩家：";
            const seer = players.find(p => p.role === '預言家');
            
            if (seer && seer.isAlive) {
                let selectHtml = `<select id="seer-select" onchange="checkSeer(this.value)">
                                    <option value="">-- 請選擇 --</option>`;
                players.filter(p => p.isAlive && p.role !== '預言家').forEach(p => {
                    selectHtml += `<option value="${p.id}">${p.name}</option>`;
                });
                selectHtml += `</select><p id="seer-result" style="margin-top:10px; font-weight:bold;"></p>`;
                actionsDiv.innerHTML = selectHtml;
            } else {
                actionsDiv.innerHTML = "<p>（預言家已死亡，直接跳過）</p>";
            }

        } else if (nightStep === 2) {
            // 女巫階段
            instruction.innerText = "🧪 女巫請睜眼：";
            const witch = players.find(p => p.role === '女巫');

            if (witch && witch.isAlive) {
                let html = '';
                const victim = wolfTarget !== null ? players.find(p => p.id === wolfTarget) : null;
                
                if (victim) {
                    html += `<p>今晚被襲擊的是：<strong>${victim.name}</strong></p>`;
                    if (witchHasSave) {
                        html += `<label><input type="checkbox" id="witch-save-cb"> 使用解藥救他</label><br><br>`;
                    } else {
                        html += `<p>（解藥已使用過）</p>`;
                    }
                } else {
                    html += `<p>今晚是平安夜（無人被襲擊）</p>`;
                }

                if (witchHasPoison) {
                    html += `<p>選擇使用毒藥的對象：</p>`;
                    html += `<select id="witch-poison-select"><option value="">-- 不使用毒藥 --</option>`;
                    players.filter(p => p.isAlive).forEach(p => {
                        html += `<option value="${p.id}">${p.name}</option>`;
                    });
                    html += `</select>`;
                } else {
                    html += `<p>（毒藥已使用過）</p>`;
                }
                actionsDiv.innerHTML = html;
            } else {
                actionsDiv.innerHTML = "<p>（女巫已死亡，直接跳過）</p>";
            }

        } else if (nightStep === 3) {
            // 結算女巫選擇
            const witch = players.find(p => p.role === '女巫');
            if (witch && witch.isAlive) {
                const saveCb = document.getElementById('witch-save-cb');
                if (saveCb && saveCb.checked) {
                    witchSave = true;
                    witchHasSave = false;
                }
                const poisonSelect = document.getElementById('witch-poison-select');
                if (poisonSelect && poisonSelect.value !== "") {
                    witchPoisonTarget = parseInt(poisonSelect.value);
                    witchHasPoison = false;
                }
            }
            startDayPhase();
            return;
        }

        nightStep++;
    }

    function checkSeer(targetId) {
        if (!targetId) return;
        const target = players.find(p => p.id == targetId);
        const resultText = document.getElementById('seer-result');
        if (target.role === '狼人') {
            resultText.innerText = `查驗結果：${target.name} 是 【狼人】 🐺`;
            resultText.style.color = '#e53935';
        } else {
            resultText.innerText = `查驗結果：${target.name} 是 【好人】 😇`;
            resultText.style.color = '#4caf50';
        }
    }

    // 白天階段邏輯
    function startDayPhase() {
        showScreen('day-screen');
        
        let deadTonight = [];
        
        // 結算狼人目標與女巫解藥
        if (wolfTarget !== null && !witchSave) {
            deadTonight.push(wolfTarget);
        }
        // 結算女巫毒藥
        if (witchPoisonTarget !== null) {
            deadTonight.push(witchPoisonTarget);
        }

        // 去重並執行死亡
        deadTonight = [...new Set(deadTonight)];
        deadTonight.forEach(id => {
            players.find(p => p.id === id).isAlive = false;
        });

        // 渲染報告
        const reportDiv = document.getElementById('night-report');
        if (deadTonight.length === 0) {
            reportDiv.innerHTML = "昨晚是 <strong>平安夜</strong>，沒有人死亡。";
        } else {
            const names = deadTonight.map(id => players.find(p => p.id === id).name).join('、');
            reportDiv.innerHTML = `昨晚死亡的玩家：<strong style="color:var(--primary-color);">${names}</strong>`;
        }

        updateDayUI();
        checkGameOver();
    }

    function updateDayUI() {
        const list = document.getElementById('day-player-list');
        const select = document.getElementById('vote-select');
        
        list.innerHTML = '';
        select.innerHTML = '<option value="">-- 請選擇放逐目標 --</option>';

        players.forEach(p => {
            const li = document.createElement('li');
            li.className = `player-item ${p.isAlive ? '' : 'dead'}`;
            li.innerHTML = `<span>${p.name}</span> <span>${p.isAlive ? '存活' : '已陣亡'}</span>`;
            list.appendChild(li);

            if (p.isAlive) {
                select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            }
        });
    }

    function castVote() {
        const select = document.getElementById('vote-select');
        if (select.value === "") {
            alert("請先選擇要放逐的玩家！");
            return;
        }

        const targetId = parseInt(select.value);
        const victim = players.find(p => p.id === targetId);
        victim.isAlive = false;

        alert(`經過發言與投票，${victim.name} 被放逐出局！`);

        if (!checkGameOver()) {
            // 若遊戲尚未結束，進入下一個夜晚
            startNightPhase();
        }
    }

    // 勝負判定
    function checkGameOver() {
        const wolves = players.filter(p => p.isAlive && p.role === '狼人');
        const goods = players.filter(p => p.isAlive && p.role !== '狼人');

        if (wolves.length === 0) {
            endGame('🎉 好人陣營獲勝！所有狼人已被消滅。');
            return true;
        } else if (wolves.length >= goods.length) {
            endGame('🐺 狼人陣營獲勝！狼人數量已大於或等於好人。');
            return true;
        }
        return false;
    }

    function endGame(message) {
        showScreen('gameover-screen');
        document.getElementById('winner-title').innerText = message;

        const rolesList = document.getElementById('final-roles');
        rolesList.innerHTML = '';
        players.forEach(p => {
            const li = document.createElement('li');
            li.className = 'player-item';
            li.innerHTML = `<span>${p.name}</span> <span>${p.role} (${p.isAlive ? '存活' : '陣亡'})</span>`;
            rolesList.appendChild(li);
        });
    }
</script>

</body>
</html>
