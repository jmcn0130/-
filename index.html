<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>duscat狼人殺</title>
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --primary: #e53935;
            --text: #ffffff;
            --sub: #b0bec5;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; }
        h1, h2 { color: var(--primary); margin-top: 0; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        .screen { display: none; }
        .active { display: block; }
        .room-code { font-size: 32px; letter-spacing: 4px; color: #4fc3f7; font-weight: bold; margin: 10px 0; }
        .player-list { list-style: none; padding: 0; text-align: left; }
        .player-item { background: #2a2a2a; margin: 6px 0; padding: 10px 15px; border-radius: 6px; display: flex; justify-content: space-between; }
        .role-card { background: #333; padding: 15px; border-radius: 8px; font-size: 20px; font-weight: bold; margin: 15px 0; color: #ffca28; }
        .dead { text-decoration: line-through; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 大廳 -->
    <div id="lobby-screen" class="screen active">
        <h1>🐺 duscat狼人殺</h1>
        <input type="text" id="player-name-input" placeholder="請輸入你的暱稱">
        <button class="btn" onclick="createRoom()">創建新房間</button>
        <hr style="border-color: #333; margin: 20px 0;">
        <input type="text" id="room-code-input" placeholder="輸入 4 位數房間號">
        <button class="btn" style="background:#0288d1" onclick="joinRoom()">加入房間</button>
    </div>

    <!-- 2. 等待室 -->
    <div id="room-screen" class="screen">
        <h2>房間號碼</h2>
        <div id="display-room-code" class="room-code">----</div>
        <h3>當前玩家 (<span id="player-count">0</span>/6)</h3>
        <ul id="waiting-player-list" class="player-list"></ul>
        <div id="host-controls" style="display:none;">
            <p style="color:var(--sub); font-size:14px;">滿 6 人後房主可開始遊戲</p>
            <button id="start-btn" class="btn" onclick="hostStartGame()" disabled>人數不足</button>
        </div>
        <p id="guest-msg" style="color:var(--sub);">等待房主開始遊戲...</p>
    </div>

    <!-- 3. 遊戲主畫面 -->
    <div id="game-screen" class="screen">
        <h2 id="phase-title">準備階段</h2>
        <div id="my-role-card" class="role-card">身分加載中...</div>

        <!-- 房主專用夜間/白天控制台 -->
        <div id="action-box"></div>
    </div>

    <!-- 4. 遊戲結束 -->
    <div id="gameover-screen" class="screen">
        <h1 id="winner-title"></h1>
        <ul id="final-roles" class="player-list"></ul>
        <button class="btn" onclick="location.reload()">回到大廳</button>
    </div>
</div>

<script>
    // ----------------------------------------------------
    // 請將下方貼換成你在 Firebase 取得的實際設定檔
    // ----------------------------------------------------
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };
    // ----------------------------------------------------

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
    let myName = '';
    let currentRoomCode = '';
    let isHost = false;
    let roomRef = null;

    const rolesConfig = ['狼人', '狼人', '預言家', '女巫', '平民', '平民'];

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function createRoom() {
        myName = document.getElementById('player-name-input').value.trim();
        if (!myName) return alert("請輸入暱稱！");

        currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
        isHost = true;
        roomRef = db.ref('rooms/' + currentRoomCode);

        const initialData = {
            state: 'waiting',
            host: myPlayerId,
            players: {
                [myPlayerId]: { name: myName, isAlive: true, role: '' }
            },
            nightActions: { wolfTarget: null, seerTarget: null, witchSave: false, witchPoisonTarget: null }
        };

        roomRef.set(initialData).then(() => {
            enterRoomUI();
            listenToRoom();
        });
    }

    function joinRoom() {
        myName = document.getElementById('player-name-input').value.trim();
        const code = document.getElementById('room-code-input').value.trim();
        if (!myName || !code) return alert("請填寫暱稱和房間號！");

        currentRoomCode = code;
        roomRef = db.ref('rooms/' + currentRoomCode);

        roomRef.once('value', snapshot => {
            if (!snapshot.exists()) return alert("房間不存在！");
            const data = snapshot.val();
            if (data.state !== 'waiting') return alert("遊戲已開始，無法加入！");
            
            const pCount = Object.keys(data.players || {}).length;
            if (pCount >= 6) return alert("房間已滿 6 人！");

            roomRef.child('players/' + myPlayerId).set({
                name: myName, isAlive: true, role: ''
            }).then(() => {
                isHost = false;
                enterRoomUI();
                listenToRoom();
            });
        });
    }

    function enterRoomUI() {
        showScreen('room-screen');
        document.getElementById('display-room-code').innerText = currentRoomCode;
        if (isHost) {
            document.getElementById('host-controls').style.display = 'block';
            document.getElementById('guest-msg').style.display = 'none';
        }
    }

    function listenToRoom() {
        roomRef.on('value', snapshot => {
            const room = snapshot.val();
            if (!room) return;

            // 更新等待室列表
            const playersArr = Object.entries(room.players || {}).map(([id, p]) => ({ id, ...p }));
            document.getElementById('player-count').innerText = playersArr.length;
            
            const listEl = document.getElementById('waiting-player-list');
            listEl.innerHTML = playersArr.map(p => `<li class="player-item">${p.name} ${p.id === room.host ? '👑(房主)' : ''}</li>`).join('');

            if (isHost) {
                const btn = document.getElementById('start-btn');
                if (playersArr.length === 6) {
                    btn.disabled = false;
                    btn.innerText = "開始遊戲";
                } else {
                    btn.disabled = true;
                    btn.innerText = `還差 ${6 - playersArr.length} 人`;
                }
            }

            // 狀態變更監聽
            if (room.state === 'playing') {
                showScreen('game-screen');
                renderGamePhase(room);
            } else if (room.state === 'gameover') {
                showScreen('gameover-screen');
                document.getElementById('winner-title').innerText = room.winnerText;
                document.getElementById('final-roles').innerHTML = playersArr.map(p => 
                    `<li class="player-item"><span>${p.name}</span><span>${p.role} (${p.isAlive ? '存活' : '陣亡'})</span></li>`
                ).join('');
            }
        });
    }

    // 洗牌函數
    function shuffle(arr) {
        return arr.sort(() => Math.random() - 0.5);
    }

    // 房主發起遊戲發牌
    function hostStartGame() {
        roomRef.once('value', snapshot => {
            const room = snapshot.val();
            const pIds = Object.keys(room.players);
            const shuffledRoles = shuffle([...rolesConfig]);

            let updates = {};
            pIds.forEach((id, idx) => {
                updates[`players/${id}/role`] = shuffledRoles[idx];
            });
            updates['state'] = 'playing';
            updates['phase'] = 'night_wolf'; // 第一夜開始

            roomRef.update(updates);
        });
    }

    // 渲染遊戲階段與操作
    function renderGamePhase(room) {
        const myData = room.players[myPlayerId];
        document.getElementById('my-role-card').innerText = `你的身分：${myData.role} (${myData.isAlive ? '存活' : '已陣亡'})`;

        const title = document.getElementById('phase-title');
        const box = document.getElementById('action-box');
        box.innerHTML = '';

        const alivePlayers = Object.entries(room.players)
            .map(([id, p]) => ({ id, ...p }))
            .filter(p => p.isAlive);

        if (!myData.isAlive) {
            title.innerText = "👻 你已陣亡，觀戰中...";
            return;
        }

        // --- 階段 1：狼人請睜眼 ---
        if (room.phase === 'night_wolf') {
            title.innerText = "🌙 夜晚：狼人請睜眼";
            if (myData.role === '狼人') {
                box.innerHTML = `<h3>🐺 請選擇擊殺目標：</h3>` + createSelect('wolf-target', alivePlayers);
                if (isHost) {
                    box.innerHTML += `<button class="btn" onclick="hostNextPhase('night_seer')">確認並進入預言家階段</button>`;
                }
            } else {
                box.innerHTML = `<p>狼人正在閉眼行動中...</p>`;
            }
        } 
        // --- 階段 2：預言家請睜眼 ---
        else if (room.phase === 'night_seer') {
            title.innerText = "🌙 夜晚：預言家請睜眼";
            if (myData.role === '預言家') {
                box.innerHTML = `<h3>🔮 請選擇查驗目標：</h3>` + createSelect('seer-target', alivePlayers, myPlayerId);
                box.innerHTML += `<button class="btn" onclick="checkSeerRole()">查驗身分</button><p id="seer-res"></p>`;
            } else {
                box.innerHTML = `<p>預言家正在閉眼行動中...</p>`;
            }
            if (isHost) box.innerHTML += `<button class="btn" style="margin-top:20px;background:#555;" onclick="hostNextPhase('night_witch')">下一步（進入女巫階段）</button>`;
        }
        // --- 階段 3：女巫請睜眼 ---
        else if (room.phase === 'night_witch') {
            title.innerText = "🌙 夜晚：女巫請睜眼";
            if (myData.role === '女巫') {
                const victimId = room.nightActions ? room.nightActions.wolfTarget : null;
                const victim = victimId ? room.players[victimId].name : '無人';
                box.innerHTML = `<p>今晚被襲擊的是：<strong>${victim}</strong></p>`;
                box.innerHTML += `<label><input type="checkbox" id="witch-save"> 使用解藥救他</label><br><br>`;
                box.innerHTML += `<p>毒藥目標：</p>` + createSelect('witch-poison', alivePlayers);
            } else {
                box.innerHTML = `<p>女巫正在閉眼行動中...</p>`;
            }
            if (isHost) box.innerHTML += `<button class="btn" style="margin-top:20px;" onclick="hostSettleNight()">天亮了 (結算夜晚)</button>`;
        }
        // --- 階段 4：白天討論與投票 ---
        else if (room.phase === 'day_vote') {
            title.innerText = "☀️ 白天：討論與投票放逐";
            box.innerHTML = `<p>昨晚死亡：<strong>${room.lastNightDead || '平安夜'}</strong></p>`;
            box.innerHTML += `<h3>請選擇放逐投票目標：</h3>` + createSelect('vote-target', alivePlayers);
            if (isHost) {
                box.innerHTML += `<button class="btn" onclick="hostSettleVote()">處決投票目標</button>`;
            }
        }
    }

    function createSelect(id, players, excludeId = null) {
        let html = `<select id="${id}"><option value="">-- 請選擇 --</option>`;
        players.forEach(p => {
            if (p.id !== excludeId) {
                html += `<option value="${p.id}">${p.name}</option>`;
            }
        });
        return html + `</select>`;
    }

    function checkSeerRole() {
        const tid = document.getElementById('seer-target').value;
        if (!tid) return;
        roomRef.child('players/' + tid).once('value', snap => {
            const target = snap.val();
            document.getElementById('seer-res').innerText = `${target.name} 是 【${target.role === '狼人' ? '狼人 🐺' : '好人 😇'}】`;
        });
    }

    // 房主控制流與夜間結算
    function hostNextPhase(nextPhase) {
        // 保存狼人選擇
        const wolfEl = document.getElementById('wolf-target');
        if (wolfEl && wolfEl.value) {
            roomRef.child('nightActions/wolfTarget').set(wolfEl.value);
        }
        roomRef.child('phase').set(nextPhase);
    }

    function hostSettleNight() {
        roomRef.once('value', snap => {
            const room = snap.val();
            let deadList = [];
            
            // 讀取女巫畫面選擇
            const saveCb = document.getElementById('witch-save');
            const poisonEl = document.getElementById('witch-poison');
            const isSaved = saveCb ? saveCb.checked : false;
            const poisonId = poisonEl ? poisonEl.value : null;

            const wolfTarget = room.nightActions ? room.nightActions.wolfTarget : null;

            if (wolfTarget && !isSaved) deadList.push(wolfTarget);
            if (poisonId) deadList.push(poisonId);

            let deadNames = [];
            let updates = {};
            
            deadList.forEach(id => {
                updates[`players/${id}/isAlive`] = false;
                deadNames.push(room.players[id].name);
            });

            updates['lastNightDead'] = deadNames.length > 0 ? deadNames.join('、') : '無人死亡 (平安夜)';
            updates['phase'] = 'day_vote';

            roomRef.update(updates).then(() => {
                checkWinner(room.players, updates);
            });
        });
    }

    function hostSettleVote() {
        const targetId = document.getElementById('vote-target').value;
        if (!targetId) return alert("請選擇放逐目標！");

        roomRef.once('value', snap => {
            const room = snap.val();
            let updates = {};
            updates[`players/${targetId}/isAlive`] = false;
            updates['phase'] = 'night_wolf';
            updates['nightActions'] = { wolfTarget: null };

            alert(`${room.players[targetId].name} 已被放逐！`);

            roomRef.update(updates).then(() => {
                checkWinner(room.players, updates);
            });
        });
    }

    function checkWinner(playersData, currentUpdates) {
        // 合併最新死亡狀態
        let players = JSON.parse(JSON.stringify(playersData));
        Object.keys(currentUpdates).forEach(key => {
            if (key.startsWith('players/')) {
                const parts = key.split('/');
                players[parts[1]][parts[2]] = currentUpdates[key];
            }
        });

        const wolves = Object.values(players).filter(p => p.isAlive && p.role === '狼人');
        const goods = Object.values(players).filter(p => p.isAlive && p.role !== '狼人');

        if (wolves.length === 0) {
            roomRef.update({ state: 'gameover', winnerText: '🎉 好人陣營獲勝！狼人已被全滅。' });
        } else if (wolves.length >= goods.length) {
            roomRef.update({ state: 'gameover', winnerText: '🐺 狼人陣營獲勝！狼人人數已佔優勢。' });
        }
    }
</script>
</body>
</html>
