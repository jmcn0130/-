<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jun鼠叔的狼人殺</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container { width: 100%; max-width: 580px; }
    h1 { text-align: center; margin-bottom: 20px; color: #d32f2f; letter-spacing: 2px; }

    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    .card h2 { margin-bottom: 15px; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 8px; }

    input[type="text"], select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #2d2d2d;
      border: 1px solid #444;
      color: #ffffff;
      border-radius: 4px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 4px;
      background: #37474f;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    .btn:hover { background: #455a64; }
    .btn.primary { background: #c62828; }
    .btn.primary:hover { background: #b71c1c; }
    .btn.warning { background: #e65100; }
    .btn.warning:hover { background: #ef6c00; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .hidden { display: none !important; }
    hr { border: 0; height: 1px; background: #333; margin: 15px 0; }

    ul { list-style: none; padding: 0; margin: 15px 0; }
    li {
      padding: 10px 14px;
      background: #2a2a2a;
      margin-bottom: 6px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid #555;
    }

    .tag { font-size: 12px; padding: 2px 6px; background: #ff8f00; border-radius: 3px; color: #000; font-weight: bold; }
    .badge { padding: 6px 12px; background: #333; border-radius: 4px; font-size: 14px; font-weight: bold; }
    .badge.role { background: #4a148c; color: #e1bee7; }

    .game-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .log-box {
      background: #121212;
      border: 1px solid #333;
      height: 220px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      margin: 15px 0;
      font-family: monospace;
    }
    .log-item { margin-bottom: 6px; border-bottom: 1px solid #222; padding-bottom: 4px; color: #ccc; }
    .action-box { background: #2a2a2a; padding: 15px; border-radius: 4px; border: 1px solid #3a3a3a; }
    .status-text { margin-top: 10px; font-size: 14px; color: #ffb74d; text-align: center; font-weight: bold; }
    
    .rules-box {
      background: #181818;
      border: 1px solid #2a2a2a;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.5;
    }
    .rules-box b { color: #ddd; }
    
    .setting-group {
      background: #252525;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      border: 1px solid #383838;
    }
    .setting-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #ffb74d;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>jun鼠叔的狼人殺</h1>

    <!-- 步驟 1: 登入/建立房間 -->
    <div id="login-card" class="card">
      <h2>玩家設定</h2>
      <input type="text" id="username" placeholder="輸入你的暱稱" value="玩家A">
      <hr>
      <button id="btn-create-room" class="btn primary">創建新房間 (擔任房主)</button>
      <div style="margin: 12px 0; text-align: center; font-size: 14px; color: #888;">或</div>
      <input type="text" id="room-id-input" placeholder="輸入房間代碼">
      <button id="btn-join-room" class="btn">加入房間</button>
    </div>

    <!-- 步驟 2: 遊戲等待大廳 -->
    <div id="lobby-card" class="card hidden">
      <h2>遊戲大廳 <span id="room-tag" class="tag"></span></h2>
      <p style="margin-bottom: 10px;">房間代碼：<b id="room-code-display" style="color: #ff8f00;"></b></p>

      <div class="rules-box">
        <b>遊戲規則與勝負判定：</b><br>
        1. <b>好人勝</b>：狼人全部死亡。<br>
        2. <b>狼人勝</b>：狼人數等於或大於好人數。<br>
        3. <b>投票機制</b>：白天發言後進行投票，<b>最高票者放逐死亡</b>；若發生<b>平票則無人死亡</b>，直接進入下一夜。
      </div>

      <!-- 房主設定區 -->
      <div id="host-settings" class="setting-group hidden">
        <label for="max-players-select">自訂房間人數上限：</label>
        <select id="max-players-select">
          <option value="6">6 人</option>
          <option value="7">7 人</option>
          <option value="8">8 人</option>
          <option value="9">9 人</option>
          <option value="10">10 人</option>
          <option value="12">12 人</option>
          <option value="15">15 人</option>
          <option value="18">18 人</option>
        </select>
      </div>
      
      <h3>玩家列表 (<span id="player-count">0</span> / <span id="max-player-count">6</span> 人)</h3>
      <ul id="player-list"></ul>

      <div id="host-controls" class="hidden">
        <button id="btn-start-game" class="btn primary">房主開始遊戲</button>
      </div>
      <p id="client-waiting-msg" style="margin-top:10px; font-size:13px; color:#aaa; text-align:center;">等待房主開始遊戲...</p>
    </div>

    <!-- 步驟 3: 遊戲主畫面 -->
    <div id="game-card" class="card hidden">
      <div class="game-header">
        <span id="phase-display" class="badge">階段：準備中</span>
        <span id="role-display" class="badge role">身份：未知</span>
      </div>

      <div id="game-log" class="log-box"></div>

      <div id="action-panel" class="action-box">
        <h3 style="font-size: 16px; margin-bottom: 10px;">可執行動作</h3>
        <div id="action-buttons"></div>
        <div id="action-status" class="status-text"></div>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    let connections = {};
    let hostConn = null;
    let myId = '';
    let myName = '';
    let isHost = false;

    // 遊戲狀態
    let gameState = {
      phase: 'LOBBY', 
      maxPlayers: 6,  // 預設人數上限
      players: [],    
      logs: [],
      speakingIndex: 0, 
      nightData: { wolfKill: null, witchHealUsed: false, witchPoisonUsed: false, witchPoisonKill: null },
      pendingActions: {},
      votes: {}       
    };

    let myRole = '';

    const loginCard = document.getElementById('login-card');
    const lobbyCard = document.getElementById('lobby-card');
    const gameCard = document.getElementById('game-card');
    const usernameInput = document.getElementById('username');
    const playerList = document.getElementById('player-list');
    const logBox = document.getElementById('game-log');
    const actionButtons = document.getElementById('action-buttons');
    const actionStatus = document.getElementById('action-status');
    const maxPlayersSelect = document.getElementById('max-players-select');

    function initPeer(customId = null) {
      return new Promise((resolve) => {
        if (peer) {
          peer.destroy();
        }
        peer = customId ? new Peer(customId) : new Peer();
        peer.on('open', (id) => {
          myId = id;
          resolve(id);
        });
      });
    }

    // 房主建立房間
    document.getElementById('btn-create-room').addEventListener('click', async () => {
      const btn = document.getElementById('btn-create-room');
      btn.disabled = true;

      myName = usernameInput.value.trim() || '房主';
      isHost = true;
      
      const roomId = 'room-' + Math.random().toString(36).substring(2, 7);
      await initPeer(roomId);

      document.getElementById('room-code-display').innerText = roomId;
      document.getElementById('room-tag').innerText = '房主';
      document.getElementById('host-controls').classList.remove('hidden');
      document.getElementById('host-settings').classList.remove('hidden');
      document.getElementById('client-waiting-msg').classList.add('hidden');

      gameState.maxPlayers = parseInt(maxPlayersSelect.value, 10);
      gameState.players = [{ id: myId, name: myName, isAlive: true, role: '', seatNumber: 0 }];
      syncAndRender();

      peer.on('connection', (conn) => {
        conn.on('open', () => { 
          connections[conn.peer] = conn; 
        });
        conn.on('data', (data) => { 
          handleHostMessage(conn.peer, data); 
        });
        conn.on('close', () => {
          delete connections[conn.peer];
          if (gameState.phase === 'LOBBY') {
            gameState.players = gameState.players.filter(p => p.id !== conn.peer);
            addLog(`[系統] 玩家離線，已移出房間。`);
            syncAndRender();
          }
        });
      });

      showCard(lobbyCard);
    });

    // 房主更改人數上限選單事件
    maxPlayersSelect.addEventListener('change', (e) => {
      if (!isHost) return;
      const newMax = parseInt(e.target.value, 10);
      if (gameState.players.length > newMax) {
        alert(`目前已有 ${gameState.players.length} 人，人數上限不可低於當前玩家數量！`);
        maxPlayersSelect.value = gameState.maxPlayers;
        return;
      }
      gameState.maxPlayers = newMax;
      addLog(`[房主設定] 人數上限已調整為 ${newMax} 人。`);
      syncAndRender();
    });

    // 客戶端加入房間
    document.getElementById('btn-join-room').addEventListener('click', async () => {
      const btnJoin = document.getElementById('btn-join-room');
      myName = usernameInput.value.trim() || '玩家';
      const targetRoomId = document.getElementById('room-id-input').value.trim();
      if (!targetRoomId) return alert('請輸入房間代碼');

      btnJoin.disabled = true;
      isHost = false;
      await initPeer();
      hostConn = peer.connect(targetRoomId);

      hostConn.on('open', () => {
        hostConn.send({ type: 'REQ_JOIN', name: myName });
        document.getElementById('room-code-display').innerText = targetRoomId;
        document.getElementById('room-tag').innerText = '成員';
        showCard(lobbyCard);
      });

      hostConn.on('data', (data) => { handleClientMessage(data); });
      hostConn.on('close', () => {
        alert('與房主的連線已中斷。');
        location.reload();
      });
      
      setTimeout(() => { btnJoin.disabled = false; }, 3000);
    });

    // 房主處理解析訊息
    function handleHostMessage(peerId, data) {
      if (!isHost) return;

      if (data.type === 'REQ_JOIN') {
        if (gameState.phase !== 'LOBBY') {
          if (connections[peerId]) {
            connections[peerId].send({ type: 'ERROR', msg: '遊戲已開始，無法加入。' });
          }
          return;
        }

        const existingPlayer = gameState.players.find(p => p.id === peerId);

        // 人數上限檢查 (非舊玩家重新連線的情況下)
        if (!existingPlayer && gameState.players.length >= gameState.maxPlayers) {
          if (connections[peerId]) {
            connections[peerId].send({ type: 'ERROR', msg: `房間人數已滿 (上限 ${gameState.maxPlayers} 人)，無法加入！` });
          }
          return;
        }

        if (existingPlayer) {
          existingPlayer.name = data.name;
        } else {
          gameState.players.push({ id: peerId, name: data.name, isAlive: true, role: '', seatNumber: 0 });
          addLog(`[系統] ${data.name} 加入了房間。`);
        }
        syncAndRender();
      } else if (data.type === 'SUBMIT_ACTION') {
        processAction(peerId, data.action, data.targetId);
      } else if (data.type === 'END_SPEECH') {
        advanceSpeechTurn();
      }
    }

    // 客戶端接收訊息
    function handleClientMessage(data) {
      if (data.type === 'SYNC_STATE') {
        gameState = data.state;
        myRole = data.personalRole || myRole;
        renderUI();
      } else if (data.type === 'PRIVATE_NOTICE') {
        alert(data.msg);
        addLog(`[私密資訊] ${data.msg}`);
        renderUI();
      } else if (data.type === 'ERROR') {
        alert(data.msg);
        location.reload(); // 發生無法加入等重大錯誤時刷新頁面重來
      }
    }

    // 同步狀態給所有玩家
    function syncAndRender() {
      if (!isHost) return;

      gameState.players.forEach(p => {
        if (p.id === myId) return;
        if (connections[p.id]) {
          connections[p.id].send({
            type: 'SYNC_STATE',
            state: {
              phase: gameState.phase,
              maxPlayers: gameState.maxPlayers,
              players: gameState.players.map(pl => ({ id: pl.id, name: pl.name, isAlive: pl.isAlive, seatNumber: pl.seatNumber })),
              logs: gameState.logs,
              speakingIndex: gameState.speakingIndex,
              nightData: { wolfKill: gameState.nightData.wolfKill }
            },
            personalRole: p.role
          });
        }
      });

      myRole = gameState.players.find(p => p.id === myId)?.role || '';
      renderUI();
    }

    function addLog(msg) {
      gameState.logs.push(msg);
      if (gameState.logs.length > 60) gameState.logs.shift();
    }

    // 畫面 UI 渲染
    function renderUI() {
      document.getElementById('player-count').innerText = gameState.players.length;
      document.getElementById('max-player-count').innerText = gameState.maxPlayers;

      playerList.innerHTML = gameState.players.map(p => 
        `<li><span>${p.seatNumber ? p.seatNumber + '號 ' : ''}${p.name} ${p.id === myId ? '(你)' : ''} ${!p.isAlive ? '[已死亡]' : ''}</span>${p.id === gameState.players[0]?.id ? '<span class="tag">房主</span>' : ''}</li>`
      ).join('');

      if (gameState.phase === 'LOBBY') {
        showCard(lobbyCard);
        return;
      }

      showCard(gameCard);
      document.getElementById('role-display').innerText = `身份：${myRole || '觀眾'}`;
      document.getElementById('phase-display').innerText = `階段：${getPhaseName(gameState.phase)}`;

      logBox.innerHTML = gameState.logs.map(l => `<div class="log-item">${l}</div>`).join('');
      logBox.scrollTop = logBox.scrollHeight;

      renderActionPanel();
    }

    // 渲染行動區塊
    function renderActionPanel() {
      actionButtons.innerHTML = '';
      actionStatus.innerText = '';

      const me = gameState.players.find(p => p.id === myId);
      if (!me || !me.isAlive) {
        actionStatus.innerText = '你已死亡，進入觀戰狀態。';
        return;
      }

      if (gameState.phase === 'NIGHT_WOLF' && myRole === '狼人') {
        actionStatus.innerText = '選擇今晚襲擊目標：';
        gameState.players.filter(p => p.isAlive).forEach(p => {
          createActionButton(`襲擊 ${p.seatNumber}號 ${p.name}`, () => sendAction('WOLF_KILL', p.id));
        });
      } else if (gameState.phase === 'NIGHT_SEER' && myRole === '預言家') {
        actionStatus.innerText = '選擇查驗對象（系統將會告知對方的陣營）：';
        gameState.players.filter(p => p.isAlive && p.id !== myId).forEach(p => {
          createActionButton(`查驗 ${p.seatNumber}號 ${p.name}`, () => sendAction('SEER_CHECK', p.id));
        });
      } else if (gameState.phase === 'NIGHT_WITCH' && myRole === '女巫') {
        const victim = gameState.players.find(p => p.id === gameState.nightData.wolfKill);
        let statusMsg = victim ? `昨晚遇害的是：${victim.seatNumber}號 ${victim.name}` : '昨晚無人遇害。';
        actionStatus.innerText = statusMsg;

        if (victim && !gameState.nightData.witchHealUsed) {
          createActionButton(`使用解藥救活 ${victim.name}`, () => sendAction('WITCH_HEAL', victim.id));
        }
        if (!gameState.nightData.witchPoisonUsed) {
          gameState.players.filter(p => p.isAlive && p.id !== myId).forEach(p => {
            createActionButton(`使用毒藥毒殺 ${p.seatNumber}號 ${p.name}`, () => sendAction('WITCH_POISON', p.id));
          });
        }
        createActionButton('不使用任何藥水', () => sendAction('SKIP', null));

      } else if (gameState.phase === 'DAY_DISCUSSION') {
        const alivePlayers = gameState.players.filter(p => p.isAlive);
        const currentSpeaker = alivePlayers[gameState.speakingIndex];

        if (currentSpeaker) {
          if (currentSpeaker.id === myId) {
            actionStatus.innerText = '輪到你發言，發表看法後請點擊下方按鈕：';
            createActionButton('結束發言', () => endSpeech(), 'primary');
          } else {
            actionStatus.innerText = `正在等待 ${currentSpeaker.seatNumber}號玩家 [${currentSpeaker.name}] 發言中...`;
          }

          if (myRole === '騎士') {
            const knightSkillDiv = document.createElement('div');
            knightSkillDiv.style.marginTop = '15px';
            knightSkillDiv.innerHTML = '<p style="color:#ffb74d; font-size:13px;">騎士技能：可在討論階段進行決鬥</p>';
            gameState.players.filter(p => p.isAlive && p.id !== myId).forEach(p => {
              const btn = document.createElement('button');
              btn.className = 'btn warning';
              btn.innerText = `與 ${p.seatNumber}號 ${p.name} 決鬥`;
              btn.onclick = () => sendAction('KNIGHT_DUEL', p.id);
              knightSkillDiv.appendChild(btn);
            });
            actionButtons.appendChild(knightSkillDiv);
          }
        }

      } else if (gameState.phase === 'DAY_VOTE') {
        actionStatus.innerText = '發言完畢，請投下放逐票：';
        gameState.players.filter(p => p.isAlive && p.id !== myId).forEach(p => {
          createActionButton(`投給 ${p.seatNumber}號 ${p.name}`, () => sendAction('VOTE', p.id));
        });
      } else {
        actionStatus.innerText = '請等待其他玩家完成動作...';
      }
    }

    function createActionButton(text, onClick, styleClass = '') {
      const btn = document.createElement('button');
      btn.className = `btn ${styleClass}`;
      btn.innerText = text;
      btn.onclick = onClick;
      actionButtons.appendChild(btn);
    }

    function sendAction(actionType, targetId) {
      actionButtons.innerHTML = '';
      actionStatus.innerText = '動作已提交，等待其他玩家...';

      if (isHost) {
        processAction(myId, actionType, targetId);
      } else {
        hostConn.send({ type: 'SUBMIT_ACTION', action: actionType, targetId: targetId });
      }
    }

    function endSpeech() {
      actionButtons.innerHTML = '';
      actionStatus.innerText = '你已結束發言。';

      if (isHost) {
        advanceSpeechTurn();
      } else {
        hostConn.send({ type: 'END_SPEECH' });
      }
    }

    // 房主：推進發言順序
    function advanceSpeechTurn() {
      if (!isHost) return;

      const alivePlayers = gameState.players.filter(p => p.isAlive);
      gameState.speakingIndex++;

      if (gameState.speakingIndex >= alivePlayers.length) {
        gameState.phase = 'DAY_VOTE';
        gameState.votes = {};
        addLog('[系統] 所有玩家發言完畢，進入【投票放逐階段】。');
      } else {
        const nextSpeaker = alivePlayers[gameState.speakingIndex];
        addLog(`[發言] 輪到 ${nextSpeaker.seatNumber}號玩家 [${nextSpeaker.name}] 發言。`);
      }
      syncAndRender();
    }

    // 房主：處理核心遊戲邏輯與預言家查驗
    function processAction(peerId, action, targetId) {
      if (!isHost) return;

      if (action === 'WOLF_KILL') {
        gameState.nightData.wolfKill = targetId;
        gameState.phase = 'NIGHT_SEER';
        addLog('[黑夜] 狼人已完成行動，預言家請睜眼查驗。');
      } else if (action === 'SEER_CHECK') {
        const target = gameState.players.find(p => p.id === targetId);
        const isWolf = target.role === '狼人';
        const resultMsg = `【查驗結果】${target.seatNumber}號玩家 [${target.name}] 的陣營為：${isWolf ? '狼人 (壞人)' : '好人'}`;

        if (peerId === myId) {
          alert(resultMsg);
          addLog(`[私密資訊] ${resultMsg}`);
        } else if (connections[peerId]) {
          connections[peerId].send({
            type: 'PRIVATE_NOTICE',
            msg: resultMsg
          });
        }

        gameState.phase = 'NIGHT_WITCH';
        addLog('[黑夜] 預言家已完成查驗，女巫請睜眼。');
      } else if (action === 'WITCH_HEAL') {
        gameState.nightData.wolfKill = null;
        gameState.nightData.witchHealUsed = true;
        finishNightPhase();
        return;
      } else if (action === 'WITCH_POISON') {
        gameState.nightData.witchPoisonKill = targetId;
        gameState.nightData.witchPoisonUsed = true;
        finishNightPhase();
        return;
      } else if (action === 'SKIP') {
        finishNightPhase();
        return;
      } else if (action === 'KNIGHT_DUEL') {
        const knight = gameState.players.find(p => p.id === peerId);
        const target = gameState.players.find(p => p.id === targetId);
        
        addLog(`[決鬥] 騎士 [${knight.name}] 選擇與 [${target.name}] 決鬥！`);
        if (target.role === '狼人') {
          target.isAlive = false;
          addLog(`[決鬥] [${target.name}] 是狼人！[${target.name}] 被當場斬殺！`);
        } else {
          knight.isAlive = false;
          addLog(`[決鬥] [${target.name}] 是好人！騎士 [${knight.name}] 決鬥失敗撞劍身亡！`);
        }
        checkWinCondition();
      } else if (action === 'VOTE') {
        gameState.votes[peerId] = targetId;
        const alivePlayers = gameState.players.filter(p => p.isAlive);

        if (Object.keys(gameState.votes).length >= alivePlayers.length) {
          addLog('[投票結算] 所有玩家投票完畢，計算結果中...');

          const counts = {}; 
          for (let voterId in gameState.votes) {
            const tId = gameState.votes[voterId];
            counts[tId] = (counts[tId] || 0) + 1;
            
            const voter = gameState.players.find(p => p.id === voterId);
            const target = gameState.players.find(p => p.id === tId);
            addLog(`-> ${voter.seatNumber}號 [${voter.name}] 投給了 ${target.seatNumber}號 [${target.name}]`);
          }

          let maxVotes = 0;
          for (let tId in counts) {
            if (counts[tId] > maxVotes) {
              maxVotes = counts[tId];
            }
          }

          const topVotedIds = Object.keys(counts).filter(tId => counts[tId] === maxVotes);

          if (topVotedIds.length === 1) {
            const executed = gameState.players.find(p => p.id === topVotedIds[0]);
            executed.isAlive = false;
            addLog(`[放逐結果] 玩家 [${executed.seatNumber}號 ${executed.name}] 獲得最高票 (${maxVotes} 票)，被放逐死亡！`);
          } else {
            addLog(`[放逐結果] 出現平票 (最高票數為 ${maxVotes} 票)，本日無人被放逐！`);
          }

          if (!checkWinCondition()) {
            setTimeout(() => {
              startNightPhase();
            }, 3000); 
          }
          return;
        }
      }

      syncAndRender();
    }

    // 房主：黑夜結束，進入白天
    function finishNightPhase() {
      let deaths = [];
      if (gameState.nightData.wolfKill) {
        const v1 = gameState.players.find(p => p.id === gameState.nightData.wolfKill);
        if (v1) { v1.isAlive = false; deaths.push(`${v1.seatNumber}號 ${v1.name}`); }
      }
      if (gameState.nightData.witchPoisonKill) {
        const v2 = gameState.players.find(p => p.id === gameState.nightData.witchPoisonKill);
        if (v2) { v2.isAlive = false; deaths.push(`${v2.seatNumber}號 ${v2.name}`); }
      }

      gameState.phase = 'DAY_DISCUSSION';
      gameState.speakingIndex = 0;

      if (deaths.length > 0) {
        addLog(`[天亮] 昨晚遇害的玩家為：${deaths.join(', ')}。`);
      } else {
        addLog(`[天亮] 昨晚是平安夜，無人死亡。`);
      }

      const alivePlayers = gameState.players.filter(p => p.isAlive);
      if (alivePlayers.length > 0) {
        addLog(`[發言] 請依照座號順序發言，首先由 ${alivePlayers[0].seatNumber}號玩家 [${alivePlayers[0].name}] 開始發言。`);
      }

      checkWinCondition();
      syncAndRender();
    }

    // 房主：進入黑夜
    function startNightPhase() {
      gameState.phase = 'NIGHT_WOLF';
      gameState.nightData.wolfKill = null;
      gameState.nightData.witchPoisonKill = null;
      addLog('[黑夜] 夜幕降臨，狼人請開始行動。');
      checkWinCondition();
      syncAndRender();
    }

    // 核心勝負判斷邏輯
    function checkWinCondition() {
      const aliveWolves = gameState.players.filter(p => p.isAlive && p.role === '狼人');
      const aliveGodsAndCivs = gameState.players.filter(p => p.isAlive && p.role !== '狼人');

      if (aliveWolves.length === 0) {
        addLog('[勝負結算] 狼人已全部死亡，好人陣營獲得最終勝利！');
        gameState.phase = 'END';
        syncAndRender();
        return true;
      } else if (aliveWolves.length >= aliveGodsAndCivs.length) {
        addLog(`[勝負結算] 狼人人數 (${aliveWolves.length}人) 已等於或超越好人人數 (${aliveGodsAndCivs.length}人)，狼人陣營獲得最終勝利！`);
        gameState.phase = 'END';
        syncAndRender();
        return true;
      }
      return false;
    }

    // 房主點擊開始遊戲
    document.getElementById('btn-start-game').addEventListener('click', () => {
      if (gameState.players.length < 6) {
        return alert('遊玩人數不能低於 6 人！');
      }

      // 動態角色配置
      let roles = ['狼人', '狼人', '預言家', '女巫', '騎士'];
      // 若人數達到 9 人以上，多加一張狼人卡
      if (gameState.players.length >= 9) {
        roles.push('狼人');
      }
      // 剩餘位置補平民
      while (roles.length < gameState.players.length) {
        roles.push('平民');
      }
      roles.sort(() => Math.random() - 0.5);

      gameState.players.forEach((p, idx) => {
        p.role = roles[idx];
        p.isAlive = true;
        p.seatNumber = idx + 1;
      });

      gameState.logs = [];
      addLog('[系統] 遊戲開始，座位號碼已分配完畢。');
      startNightPhase();
    });

    function showCard(card) {
      [loginCard, lobbyCard, gameCard].forEach(c => c.classList.add('hidden'));
      card.classList.remove('hidden');
    }

    function getPhaseName(phase) {
      switch (phase) {
        case 'NIGHT_WOLF': return '黑夜 - 狼人行動';
        case 'NIGHT_SEER': return '黑夜 - 預言家行動';
        case 'NIGHT_WITCH': return '黑夜 - 女巫行動';
        case 'DAY_DISCUSSION': return '白天 - 順序發言討論';
        case 'DAY_VOTE': return '白天 - 投票放逐階段';
        case 'END': return '遊戲結束';
        default: return '等待中';
      }
    }
  </script>
</body>
