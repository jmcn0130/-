<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC 狼人殺多人連線系統</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container { width: 100%; max-width: 550px; }
    h1 { text-align: center; margin-bottom: 20px; color: #d32f2f; letter-spacing: 2px; }

    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    .card h2 { margin-bottom: 15px; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 8px; }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #2d2d2d;
      border: 1px solid #444;
      color: #ffffff;
      border-radius: 4px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 4px;
      background: #37474f;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    .btn:hover { background: #455a64; }
    .btn.primary { background: #c62828; }
    .btn.primary:hover { background: #b71c1c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .hidden { display: none !important; }
    hr { border: 0; height: 1px; background: #333; margin: 15px 0; }

    ul { list-style: none; padding: 0; margin: 15px 0; }
    li {
      padding: 10px 14px;
      background: #2a2a2a;
      margin-bottom: 6px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid #555;
    }

    .tag { font-size: 12px; padding: 2px 6px; background: #ff8f00; border-radius: 3px; color: #000; font-weight: bold; }
    .badge { padding: 6px 12px; background: #333; border-radius: 4px; font-size: 14px; font-weight: bold; }
    .badge.role { background: #4a148c; color: #e1bee7; }

    .game-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .log-box {
      background: #121212;
      border: 1px solid #333;
      height: 200px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      margin: 15px 0;
      font-family: monospace;
    }
    .log-item { margin-bottom: 6px; border-bottom: 1px solid #222; padding-bottom: 4px; color: #ccc; }
    .action-box { background: #2a2a2a; padding: 15px; border-radius: 4px; border: 1px solid #3a3a3a; }
    .status-text { margin-top: 10px; font-size: 13px; color: #aaa; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>狼人殺連線對戰系統</h1>

    <!-- 步驟 1: 登入/建立房間 -->
    <div id="login-card" class="card">
      <h2>玩家設定</h2>
      <input type="text" id="username" placeholder="輸入你的暱稱" value="玩家A">
      <hr>
      <button id="btn-create-room" class="btn primary">創建新房間 (擔任房主)</button>
      <div style="margin: 12px 0; text-align: center; font-size: 14px; color: #888;">或</div>
      <input type="text" id="room-id-input" placeholder="輸入房間代碼">
      <button id="btn-join-room" class="btn">加入房間</button>
    </div>

    <!-- 步驟 2: 遊戲等待大廳 -->
    <div id="lobby-card" class="card hidden">
      <h2>遊戲大廳 <span id="room-tag" class="tag"></span></h2>
      <p style="margin-bottom: 10px;">房間代碼：<b id="room-code-display" style="color: #ff8f00;"></b> (分享給其他玩家)</p>
      
      <h3>玩家列表 (<span id="player-count">0</span>)</h3>
      <ul id="player-list"></ul>

      <div id="host-controls" class="hidden">
        <button id="btn-start-game" class="btn primary">房主開始遊戲</button>
      </div>
      <p id="client-waiting-msg" class="status-text">等待房主開始遊戲...</p>
    </div>

    <!-- 步驟 3: 遊戲主畫面 -->
    <div id="game-card" class="card hidden">
      <div class="game-header">
        <span id="phase-display" class="badge">階段：準備中</span>
        <span id="role-display" class="badge role">身份：未知</span>
      </div>

      <div id="game-log" class="log-box"></div>

      <div id="action-panel" class="action-box">
        <h3 style="font-size: 16px; margin-bottom: 10px;">可執行動作</h3>
        <div id="action-buttons"></div>
        <div id="action-status" class="status-text"></div>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    let connections = {};
    let hostConn = null;
    let myId = '';
    let myName = '';
    let isHost = false;

    // 權威遊戲狀態 (由房主維護並廣播)
    let gameState = {
      phase: 'LOBBY', // LOBBY, NIGHT_ACTION, DAY_DISCUSSION, DAY_VOTE, END
      players: [],    // { id, name, isAlive, role }
      logs: [],
      pendingActions: {}, // 紀錄本階段已提交行動的玩家列表
      votes: {},          // 投票紀錄
      nightTarget: null   // 夜間襲擊目標
    };

    let myRole = '';

    // DOM 元素
    const loginCard = document.getElementById('login-card');
    const lobbyCard = document.getElementById('lobby-card');
    const gameCard = document.getElementById('game-card');
    const usernameInput = document.getElementById('username');
    const playerList = document.getElementById('player-list');
    const logBox = document.getElementById('game-log');
    const actionButtons = document.getElementById('action-buttons');
    const actionStatus = document.getElementById('action-status');

    function initPeer(customId = null) {
      return new Promise((resolve) => {
        peer = customId ? new Peer(customId) : new Peer();
        peer.on('open', (id) => {
          myId = id;
          resolve(id);
        });
      });
    }

    // 房主建立房間
    document.getElementById('btn-create-room').addEventListener('click', async () => {
      myName = usernameInput.value.trim() || '房主';
      isHost = true;
      
      const roomId = 'room-' + Math.random().toString(36).substring(2, 7);
      await initPeer(roomId);

      document.getElementById('room-code-display').innerText = roomId;
      document.getElementById('room-tag').innerText = '房主';
      document.getElementById('host-controls').classList.remove('hidden');
      document.getElementById('client-waiting-msg').classList.add('hidden');

      gameState.players.push({ id: myId, name: myName, isAlive: true, role: '' });
      syncAndRender();

      peer.on('connection', (conn) => {
        conn.on('open', () => {
          connections[conn.peer] = conn;
        });

        conn.on('data', (data) => {
          handleHostMessage(conn.peer, data);
        });

        conn.on('close', () => {
          delete connections[conn.peer];
          gameState.players = gameState.players.filter(p => p.id !== conn.peer);
          addLog(`[系統] 玩家離線，已移出房間。`);
          syncAndRender();
        });
      });

      showCard(lobbyCard);
    });

    // 客戶端加入房間
    document.getElementById('btn-join-room').addEventListener('click', async () => {
      myName = usernameInput.value.trim() || '玩家';
      const targetRoomId = document.getElementById('room-id-input').value.trim();
      if (!targetRoomId) return alert('請輸入房間代碼');

      isHost = false;
      await initPeer();

      hostConn = peer.connect(targetRoomId);

      hostConn.on('open', () => {
        hostConn.send({ type: 'REQ_JOIN', name: myName });
        document.getElementById('room-code-display').innerText = targetRoomId;
        document.getElementById('room-tag').innerText = '成員';
        showCard(lobbyCard);
      });

      hostConn.on('data', (data) => {
        handleClientMessage(data);
      });

      hostConn.on('close', () => {
        alert('與房主的連線已中斷。');
        location.reload();
      });
    });

    // 房主處理解析核心訊息
    function handleHostMessage(peerId, data) {
      if (!isHost) return;

      if (data.type === 'REQ_JOIN') {
        if (gameState.phase !== 'LOBBY') {
          connections[peerId].send({ type: 'ERROR', msg: '遊戲已開始，無法加入。' });
          return;
        }
        gameState.players.push({ id: peerId, name: data.name, isAlive: true, role: '' });
        addLog(`[系統] ${data.name} 加入了房間。`);
        syncAndRender();
      } else if (data.type === 'SUBMIT_ACTION') {
        processPlayerAction(peerId, data.targetId);
      }
    }

    // 客戶端接收來自房主的廣播訊息
    function handleClientMessage(data) {
      if (data.type === 'SYNC_STATE') {
        gameState = data.state;
        myRole = data.personalRole || myRole;
        renderUI();
      } else if (data.type === 'ERROR') {
        alert(data.msg);
      }
    }

    // 房主專用：將完整狀態強行同步給所有客戶端，保證數據絕對一致
    function syncAndRender() {
      if (!isHost) return;

      gameState.players.forEach(p => {
        if (p.id === myId) return;
        if (connections[p.id]) {
          connections[p.id].send({
            type: 'SYNC_STATE',
            state: {
              phase: gameState.phase,
              players: gameState.players.map(pl => ({ id: pl.id, name: pl.name, isAlive: pl.isAlive })),
              logs: gameState.logs
            },
            personalRole: p.role
          });
        }
      });

      myRole = gameState.players.find(p => p.id === myId)?.role || '';
      renderUI();
    }

    function addLog(msg) {
      gameState.logs.push(msg);
      if (gameState.logs.length > 50) gameState.logs.shift();
    }

    // UI 統一渲染邏輯
    function renderUI() {
      // 1. 更新大廳
      document.getElementById('player-count').innerText = gameState.players.length;
      playerList.innerHTML = gameState.players.map(p => 
        `<li><span>${p.name} ${p.id === myId ? '(你)' : ''}</span>${p.id === gameState.players[0]?.id ? '<span class="tag">房主</span>' : ''}</li>`
      ).join('');

      if (gameState.phase === 'LOBBY') {
        showCard(lobbyCard);
        return;
      }

      // 2. 更新遊戲卡片
      showCard(gameCard);
      document.getElementById('role-display').innerText = `身份：${myRole || '觀眾'}`;
      document.getElementById('phase-display').innerText = `階段：${getPhaseName(gameState.phase)}`;

      // 渲染 Log
      logBox.innerHTML = gameState.logs.map(l => `<div class="log-item">${l}</div>`).join('');
      logBox.scrollTop = logBox.scrollHeight;

      // 渲染操作按鈕
      renderActionPanel();
    }

    function renderActionPanel() {
      actionButtons.innerHTML = '';
      actionStatus.innerText = '';

      const me = gameState.players.find(p => p.id === myId);
      if (!me || !me.isAlive) {
        actionStatus.innerText = '你已死亡，無法進行操作。';
        return;
      }

      if (gameState.phase === 'NIGHT_ACTION') {
        if (myRole === '狼人') {
          actionStatus.innerText = '請選擇今晚要襲擊的目標：';
          gameState.players.filter(p => p.isAlive).forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = `襲擊 ${p.name}`;
            btn.onclick = () => submitAction(p.id);
            actionButtons.appendChild(btn);
          });
        } else {
          actionStatus.innerText = '黑夜來臨，請等待其他角色完成行動...';
        }
      } else if (gameState.phase === 'DAY_VOTE') {
        actionStatus.innerText = '請投下放逐票：';
        gameState.players.filter(p => p.isAlive && p.id !== myId).forEach(p => {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = `放逐 ${p.name}`;
          btn.onclick = () => submitAction(p.id);
          actionButtons.appendChild(btn);
        });
      } else if (gameState.phase === 'DAY_DISCUSSION') {
        if (isHost) {
          const btn = document.createElement('button');
          btn.className = 'btn primary';
          btn.innerText = '發言結束，進入投票階段';
          btn.onclick = () => {
            gameState.phase = 'DAY_VOTE';
            gameState.pendingActions = {};
            gameState.votes = {};
            addLog('[系統] 發言結束，進入投票階段。');
            syncAndRender();
          };
          actionButtons.appendChild(btn);
        } else {
          actionStatus.innerText = '請自由討論，等待房主開啟投票。';
        }
      } else if (gameState.phase === 'END') {
        actionStatus.innerText = '遊戲已結束。';
      }
    }

    // 發送玩家決策
    function submitAction(targetId) {
      actionButtons.innerHTML = '';
      actionStatus.innerText = '行動已鎖定，等待階段完成...';

      if (isHost) {
        processPlayerAction(myId, targetId);
      } else {
        hostConn.send({ type: 'SUBMIT_ACTION', targetId: targetId });
      }
    }

    // 房主專用：處理並驗證玩家提交的動作
    function processPlayerAction(peerId, targetId) {
      if (gameState.pendingActions[peerId]) return; // 避免重複投票
      gameState.pendingActions[peerId] = true;

      if (gameState.phase === 'NIGHT_ACTION') {
        const player = gameState.players.find(p => p.id === peerId);
        if (player && player.role === '狼人') {
          gameState.nightTarget = targetId;
        }

        // 檢查是否所有生存的狼人都已完成行動
        const aliveWolves = gameState.players.filter(p => p.isAlive && p.role === '狼人');
        const wolvesActed = aliveWolves.every(w => gameState.pendingActions[w.id]);

        if (wolvesActed) {
          // 執行黑夜結算
          const victim = gameState.players.find(p => p.id === gameState.nightTarget);
          if (victim) {
            victim.isAlive = false;
            addLog(`[天亮] 昨晚 [${victim.name}] 遇害身亡。`);
          } else {
            addLog(`[天亮] 昨晚是平安夜，無人死亡。`);
          }

          gameState.phase = 'DAY_DISCUSSION';
          gameState.pendingActions = {};
          checkWinCondition();
          syncAndRender();
        }
      } else if (gameState.phase === 'DAY_VOTE') {
        gameState.votes[peerId] = targetId;

        const alivePlayers = gameState.players.filter(p => p.isAlive);
        if (Object.keys(gameState.votes).length >= alivePlayers.length) {
          // 執行投票結算
          const counts = {};
          Object.values(gameState.votes).forEach(tId => counts[tId] = (counts[tId] || 0) + 1);

          let maxVotes = 0;
          let executedId = null;
          for (let tId in counts) {
            if (counts[tId] > maxVotes) {
              maxVotes = counts[tId];
              executedId = tId;
            }
          }

          const executed = gameState.players.find(p => p.id === executedId);
          if (executed) {
            executed.isAlive = false;
            addLog(`[投票] 玩家 [${executed.name}] 被高票放逐。`);
          } else {
            addLog(`[投票] 同票或無人投票，今日無人被放逐。`);
          }

          gameState.phase = 'NIGHT_ACTION';
          gameState.pendingActions = {};
          gameState.votes = {};
          gameState.nightTarget = null;
          addLog('[黑夜] 夜幕降臨，狼人請開始行動。');
          checkWinCondition();
          syncAndRender();
        }
      }
    }

    // 檢查勝負條件
    function checkWinCondition() {
      const aliveWolves = gameState.players.filter(p => p.isAlive && p.role === '狼人');
      const aliveHumans = gameState.players.filter(p => p.isAlive && p.role !== '狼人');

      if (aliveWolves.length === 0) {
        addLog('[結束] 好人陣營獲得最終勝利！');
        gameState.phase = 'END';
      } else if (aliveWolves.length >= aliveHumans.length) {
        addLog('[結束] 狼人陣營獲得最終勝利！');
        gameState.phase = 'END';
      }
    }

    // 房主點擊開始遊戲
    document.getElementById('btn-start-game').addEventListener('click', () => {
      if (gameState.players.length < 3) return alert('遊戲至少需要 3 名玩家才能開始！');

      // 身份牌分配：固定 1 狼人、1 預言家，其餘平民
      let roles = ['狼人', '預言家'];
      while (roles.length < gameState.players.length) roles.push('平民');
      roles.sort(() => Math.random() - 0.5);

      gameState.players.forEach((p, idx) => {
        p.role = roles[idx];
        p.isAlive = true;
      });

      gameState.phase = 'NIGHT_ACTION';
      gameState.logs = [];
      gameState.pendingActions = {};
      gameState.votes = {};
      gameState.nightTarget = null;

      addLog('[系統] 遊戲開始。');
      addLog('[黑夜] 夜幕降臨，狼人請開始行動。');

      syncAndRender();
    });

    function showCard(card) {
      [loginCard, lobbyCard, gameCard].forEach(c => c.classList.add('hidden'));
      card.classList.remove('hidden');
    }

    function getPhaseName(phase) {
      switch (phase) {
        case 'NIGHT_ACTION': return '黑夜階段';
        case 'DAY_DISCUSSION': return '白天討論';
        case 'DAY_VOTE': return '投票階段';
        case 'END': return '遊戲結束';
        default: return '等待中';
      }
    }
  </script>
</body>
</html>
